[package]
name = "rtmalloc-bench"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
criterion = { version = "4.3.0", features = ["html_reports"], package = "codspeed-criterion-compat" }
mimalloc = "0.1"
snmalloc-rs = "0.3"
