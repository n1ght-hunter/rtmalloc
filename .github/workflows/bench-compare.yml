name: Benchmark Comparison

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: bench-compare-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  wait-for-ci:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - id: filter
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "FORCE_RUN")
          if echo "$CHANGED" | grep -qE '^(src/|rseq/|bench/|rtmalloc\.toml$|build\.rs$|\.github/|Cargo\.(toml|lock)$)|FORCE_RUN'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for CI to pass
        if: steps.filter.outputs.relevant == 'true'
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          check-name: check
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 15

  compare:
    needs: wait-for-ci
    if: needs.wait-for-ci.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: rustup show && rustup toolchain install stable --profile minimal && rustup toolchain install nightly --profile minimal

      - uses: jdx/mise-action@v3

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y autoconf libtool ninja-build dos2unix

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: bench-compare-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: bench-compare-${{ runner.os }}-

      - uses: actions/cache@v4
        with:
          path: mimalloc-bench
          key: mimalloc-bench-compare-${{ runner.os }}-v1

      - uses: astral-sh/setup-uv@v5

      - name: Run criterion benchmarks
        run: uv run .github/scripts/run-criterion.py --output book/src/benchmarks/criterion.md

      - name: Run mimalloc-bench
        run: uv run .github/scripts/run-mimalloc-bench.py --output book/src/benchmarks/mimalloc-bench.md

      - name: Build mdBook
        run: mise x -- mdbook build book

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./book/book
          force_orphan: true
